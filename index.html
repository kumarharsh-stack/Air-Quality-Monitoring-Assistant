<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js loaded from a CDN - no npm install needed -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <main class="container">
        <h1>{{ app_name }}</h1>
        <p class="subtitle">Real-time air quality, health guidance, history, and an ML prediction.</p>

        <!-- Search -->
        <div class="card">
            <form id="search-form">
                <input type="text" id="location-input" placeholder="Enter a city, e.g. Delhi" required>
                <button type="submit">Search</button>
            </form>
            <p id="search-error" class="error hidden"></p>
        </div>

        <!-- Current reading -->
        <div class="card hidden" id="result-card">
            <h2 id="result-location"></h2>
            <div class="aqi-display">
                <span id="aqi-value" class="aqi-number"></span>
                <span id="aqi-level" class="aqi-level"></span>
            </div>
            <p id="aqi-advice" class="advice"></p>

            <div class="pollutant-grid">
                <div class="pollutant"><span class="label">PM2.5</span><span id="pm25-value"></span></div>
                <div class="pollutant"><span class="label">PM10</span><span id="pm10-value"></span></div>
                <div class="pollutant"><span class="label">Ozone</span><span id="ozone-value"></span></div>
                <div class="pollutant"><span class="label">NO2</span><span id="no2-value"></span></div>
            </div>
        </div>

        <!-- History chart -->
        <div class="card hidden" id="history-card">
            <h2>History (this session's searches)</h2>
            <canvas id="history-chart" height="120"></canvas>
        </div>

        <!-- ML Prediction -->
        <div class="card hidden" id="predict-card">
            <h2>ML Prediction</h2>
            <button id="predict-button">Predict next PM2.5</button>
            <p id="predict-result"></p>
        </div>

        <!-- Assistant -->
        <div class="card hidden" id="assistant-card">
            <h2>Ask the Assistant</h2>
            <div id="chat-log" class="chat-log"></div>
            <form id="assistant-form">
                <input type="text" id="assistant-input" placeholder="e.g. Should I go for a run today?" required>
                <button type="submit">Ask</button>
            </form>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
